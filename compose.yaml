services:
  temporal:
    image: temporalio/temporal
    ports:
      - 8080:8233
    command: server start-dev --ip 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health"]
      interval: 10s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      target: builder
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - .:/go/app
    links:
      - temporal
    depends_on:
      temporal:
        condition: service_healthy

  starter:
    build:
      context: .
      target: builder
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - .:/go/app
    links:
      - temporal
    depends_on:
      worker:
        condition: service_started
      temporal:
        condition: service_healthy
    entrypoint: go
    command: run ./starter
